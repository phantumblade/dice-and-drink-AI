<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dice & Drink: board game cafe, tornei, D&D tracker e prenotazioni in un unico sito." />
  <meta name="theme-color" content="#8b5cf6" />
  <title>Dice & Drink</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neo: {
              bg: '#fdfbf7', // Off-white paper
              text: '#0f172a', // Dark slate/black
              violet: '#8b5cf6',
              pink: '#ec4899',
              lime: '#a3e635',
              green: '#22c55e',
              orange: '#fb923c',
              cyan: '#06b6d4',
              yellow: '#facc15'
            }
          },
          boxShadow: {
            'neo-sm': '2px 2px 0 0 #000000',
            'neo': '4px 4px 0 0 #000000',
            'neo-hover': '2px 2px 0 0 #000000',
            'neo-lg': '8px 8px 0 0 #000000',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;600;800&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Space Grotesk', sans-serif;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-neo-bg text-neo-text antialiased selection:bg-neo-pink selection:text-white">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
